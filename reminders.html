<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/adress.png" type="image/png">
    <title data-i18n="reminders_title">التذكيرات</title>
    <script>
        // Apply the saved direction before first paint so English pages don't flash RTL
        try {
            document.documentElement.lang = localStorage.getItem('language') || 'ar';
            document.documentElement.dir = document.documentElement.lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-brand">
                <img src="images/logo-tasks.png" alt="Logo" class="navbar-logo">
                <span data-i18n="site_title">مدير المهام اليومية</span>
            </a>
            
            <button type="button" class="mobile-menu-toggle" aria-label="القائمة" aria-expanded="false" aria-controls="navbarMenu" data-i18n-aria-label="nav_menu">☰</button>
            
            <ul class="navbar-menu" id="navbarMenu">
                <li><a href="index.html" data-i18n="nav_home">الرئيسية</a></li>
                <li><a href="tasks.html" data-i18n="nav_tasks">المهام</a></li>
                <li><a href="reminders.html" data-i18n="nav_reminders">التذكيرات</a></li>
                <li><a href="calendar.html" data-i18n="nav_calendar">التقويم</a></li>
                <li><a href="statistics.html" data-i18n="nav_statistics">الإحصائيات</a></li>
                <li><a href="tips.html" data-i18n="nav_tips">نصائح</a></li>
                <li><button id="languageToggle" class="language-toggle" data-i18n="language_toggle">English</button></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="flex-between mb-3">
            <h1 data-i18n="reminders_title">التذكيرات</h1>
            <button class="btn btn-success" onclick="openAddReminderModal()" data-i18n="reminders_add_new">إضافة تذكير</button>
        </div>

        <!-- Upcoming Reminders -->
        <div class="card mb-3">
            <h3 class="card-title" data-i18n="reminders_upcoming">التذكيرات القادمة</h3>
            <div id="upcomingRemindersList"></div>
        </div>

        <!-- Past Reminders -->
        <div class="card">
            <h3 class="card-title" data-i18n="reminders_past">التذكيرات السابقة</h3>
            <div id="pastRemindersList"></div>
        </div>
    </div>

    <!-- Add/Edit Reminder Modal -->
    <div id="reminderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" data-i18n="reminders_add_new">إضافة تذكير</h2>
                <button class="modal-close" onclick="closeModal('reminderModal')">×</button>
            </div>
            
            <form id="reminderForm" onsubmit="saveReminder(event)">
                <input type="hidden" id="reminderId">
                
                <div class="form-group">
                    <label class="form-label" data-i18n="reminder_title">عنوان التذكير</label>
                    <input type="text" id="reminderTitle" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" data-i18n="reminder_description">الوصف</label>
                    <textarea id="reminderDescription" class="form-control"></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label" data-i18n="reminder_date">التاريخ</label>
                    <input type="date" id="reminderDate" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" data-i18n="reminder_time">الوقت</label>
                    <input type="time" id="reminderTime" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" data-i18n="reminder_repeat">تكرار</label>
                    <select id="reminderRepeat" class="form-control">
                        <option value="none" data-i18n="reminder_repeat_none">بدون تكرار</option>
                        <option value="daily" data-i18n="reminder_repeat_daily">يومي</option>
                        <option value="weekly" data-i18n="reminder_repeat_weekly">أسبوعي</option>
                        <option value="monthly" data-i18n="reminder_repeat_monthly">شهري</option>
                    </select>
                </div>
                
                <div class="flex gap-2">
                    <button type="submit" class="btn btn-success" data-i18n="save">حفظ</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal('reminderModal')" data-i18n="cancel">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script src="./translations.js"></script>
    <script src="./storage.js"></script>
    <script src="./script.js"></script>
    <script>
        // عرض التذكيرات القادمة
        function displayUpcomingReminders() {
            const reminders = ReminderStorage.getUpcomingReminders();
            const container = document.getElementById('upcomingRemindersList');
            
            if (reminders.length === 0) {
                container.innerHTML = `<p class="text-center" style="color: var(--text-secondary);" data-i18n="reminders_no_upcoming">${t('reminders_no_upcoming')}</p>`;
                return;
            }
            
            container.innerHTML = reminders.map(reminder => `
                <div class="task-item" style="margin-bottom: 1rem; border-left-color: var(--warning-color);">
                    <div style="font-size: 2rem;">🔔</div>
                    <div class="task-content">
                        <div class="task-title">${escapeHtml(reminder.title)}</div>
                        ${reminder.description ? `<p style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">${escapeHtml(reminder.description)}</p>` : ''}
                        <div class="task-meta">
                            <span>📅 ${formatDate(reminder.date)}</span>
                            <span>⏰ ${formatTime(reminder.time)}</span>
                            ${reminder.repeat !== 'none' ? `<span class="badge badge-primary">${t('reminder_repeat_' + reminder.repeat)}</span>` : ''}
                        </div>
                    </div>
                    <div class="task-actions">
                        <button class="btn btn-small btn-warning" onclick="editReminder('${reminder.id}')" data-i18n="edit">تعديل</button>
                        <button class="btn btn-small btn-danger" onclick="deleteReminder('${reminder.id}')" data-i18n="delete">حذف</button>
                    </div>
                </div>
            `).join('');
            
            updatePageTranslations();
        }

        // عرض التذكيرات السابقة
        function displayPastReminders() {
            const reminders = ReminderStorage.getPastReminders();
            const container = document.getElementById('pastRemindersList');
            
            if (reminders.length === 0) {
                container.innerHTML = `<p class="text-center" style="color: var(--text-secondary);">${t('no_results')}</p>`;
                return;
            }
            
            container.innerHTML = reminders.slice(0, 10).map(reminder => `
                <div class="task-item" style="margin-bottom: 1rem; opacity: 0.6; border-left-color: var(--text-secondary);">
                    <div style="font-size: 2rem;">🔕</div>
                    <div class="task-content">
                        <div class="task-title">${escapeHtml(reminder.title)}</div>
                        ${reminder.description ? `<p style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">${escapeHtml(reminder.description)}</p>` : ''}
                        <div class="task-meta">
                            <span>📅 ${formatDate(reminder.date)}</span>
                            <span>⏰ ${formatTime(reminder.time)}</span>
                        </div>
                    </div>
                    <div class="task-actions">
                        <button class="btn btn-small btn-danger" onclick="deleteReminder('${reminder.id}')" data-i18n="delete">حذف</button>
                    </div>
                </div>
            `).join('');
            
            updatePageTranslations();
        }

        // فتح نافذة إضافة تذكير
        function openAddReminderModal() {
            document.getElementById('reminderForm').reset();
            document.getElementById('reminderId').value = '';
            
            // تعيين التاريخ والوقت الافتراضي
            const now = new Date();
            document.getElementById('reminderDate').value = toLocalDateString(now);
            document.getElementById('reminderTime').value = now.toTimeString().slice(0, 5);
            
            document.querySelector('.modal-title').setAttribute('data-i18n', 'reminders_add_new');
            document.querySelector('.modal-title').textContent = t('reminders_add_new');
            openModal('reminderModal');
        }

        // تعديل تذكير
        function editReminder(reminderId) {
            const reminders = ReminderStorage.getAllReminders();
            const reminder = reminders.find(r => r.id === reminderId);
            
            if (reminder) {
                document.getElementById('reminderId').value = reminder.id;
                document.getElementById('reminderTitle').value = reminder.title;
                document.getElementById('reminderDescription').value = reminder.description || '';
                document.getElementById('reminderDate').value = reminder.date;
                document.getElementById('reminderTime').value = reminder.time;
                document.getElementById('reminderRepeat').value = reminder.repeat || 'none';
                
                document.querySelector('.modal-title').setAttribute('data-i18n', 'edit');
                document.querySelector('.modal-title').textContent = t('edit');
                openModal('reminderModal');
            }
        }

        // حفظ تذكير
        function saveReminder(event) {
            event.preventDefault();
            
            const reminderId = document.getElementById('reminderId').value;
            const reminderData = {
                title: document.getElementById('reminderTitle').value,
                description: document.getElementById('reminderDescription').value,
                date: document.getElementById('reminderDate').value,
                time: document.getElementById('reminderTime').value,
                repeat: document.getElementById('reminderRepeat').value
            };
            
            if (reminderId) {
                ReminderStorage.updateReminder(reminderId, reminderData);
                showNotification(t('success'), 'success');
            } else {
                ReminderStorage.addReminder(reminderData);
                showNotification(t('success'), 'success');
            }
            
            closeModal('reminderModal');
            displayUpcomingReminders();
            displayPastReminders();
        }

        // حذف تذكير
        function deleteReminder(reminderId) {
            if (confirm(t('confirm'))) {
                ReminderStorage.deleteReminder(reminderId);
                showNotification(t('success'), 'success');
                displayUpcomingReminders();
                displayPastReminders();
            }
        }

        // تهيئة الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            displayUpcomingReminders();
            displayPastReminders();
        });

        document.addEventListener('app:languagechange', () => {
            displayUpcomingReminders();
            displayPastReminders();
        });
    </script>
</body>

</html>
