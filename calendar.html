<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/adress.png" type="image/png">
    <title data-i18n="calendar_title">التقويم</title>
    <script>
        // Apply the saved direction before first paint so English pages don't flash RTL
        try {
            document.documentElement.lang = localStorage.getItem('language') || 'ar';
            document.documentElement.dir = document.documentElement.lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="./style.css">
    <style>
        .calendar-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow);
        }
        
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .calendar-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .calendar-nav {
            display: flex;
            gap: 1rem;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 0.5rem;
        }
        
        .calendar-day-header {
            text-align: center;
            font-weight: 600;
            padding: 0.75rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            padding: 0.5rem;
        }
        
        .calendar-day:hover {
            background: var(--bg-color);
            transform: scale(1.05);
        }
        
        .calendar-day.today {
            background: var(--primary-color);
            color: white;
            font-weight: 700;
        }
        
        .calendar-day.other-month {
            color: var(--text-secondary);
            opacity: 0.5;
        }
        
        .calendar-day.has-events::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 6px;
            height: 6px;
            background: var(--warning-color);
            border-radius: 50%;
        }
        
        .calendar-day.today.has-events::after {
            background: white;
        }
        
        .event-list {
            margin-top: 2rem;
        }
        
        .event-item {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            border-left: 4px solid var(--primary-color);
            box-shadow: var(--shadow);
        }
        
        .event-item.task {
            border-left-color: var(--success-color);
        }
        
        .event-item.reminder {
            border-left-color: var(--warning-color);
        }

        .day-short {
            display: none;
        }

        @media (max-width: 768px) {
            .calendar-container {
                padding: 1rem;
            }

            .calendar-header {
                flex-wrap: wrap;
                gap: 0.75rem;
                margin-bottom: 1rem;
            }

            .calendar-header h2 {
                font-size: 1.25rem;
            }

            .calendar-nav {
                gap: 0.5rem;
            }

            .calendar-grid {
                gap: 0.25rem;
            }

            /* أسماء الأيام الكاملة لا تتسع لسبعة أعمدة على الهاتف */
            .day-full {
                display: none;
            }

            .day-short {
                display: inline;
            }

            .calendar-day-header {
                padding: 0.25rem 0;
                font-size: clamp(0.625rem, 2.6vw, 0.875rem);
            }

            .calendar-day {
                padding: 0.125rem;
                border-radius: 6px;
                font-size: clamp(0.75rem, 3.4vw, 1rem);
            }

            .calendar-day:hover {
                transform: none;
            }

            .calendar-day.has-events::after {
                bottom: 2px;
                width: 4px;
                height: 4px;
            }

            .event-list {
                margin-top: 1.25rem;
                overflow-wrap: anywhere;
            }
        }

        @media (max-width: 480px) {
            .calendar-container {
                padding: 0.625rem;
            }

            .calendar-grid {
                gap: 0.1875rem;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-brand">
                <img src="images/logo-tasks.png" alt="Logo" class="navbar-logo">
                <span data-i18n="site_title">مدير المهام اليومية</span>
            </a>
            
            <button type="button" class="mobile-menu-toggle" aria-label="القائمة" aria-expanded="false" aria-controls="navbarMenu" data-i18n-aria-label="nav_menu">☰</button>
            
            <ul class="navbar-menu" id="navbarMenu">
                <li><a href="index.html" data-i18n="nav_home">الرئيسية</a></li>
                <li><a href="tasks.html" data-i18n="nav_tasks">المهام</a></li>
                <li><a href="reminders.html" data-i18n="nav_reminders">التذكيرات</a></li>
                <li><a href="calendar.html" data-i18n="nav_calendar">التقويم</a></li>
                <li><a href="statistics.html" data-i18n="nav_statistics">الإحصائيات</a></li>
                <li><a href="tips.html" data-i18n="nav_tips">نصائح</a></li>
                <li><button id="languageToggle" class="language-toggle" data-i18n="language_toggle">English</button></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1 class="mb-3" data-i18n="calendar_title">التقويم</h1>
        
        <div class="calendar-container">
            <div class="calendar-header">
                <h2 id="currentMonth"></h2>
                <div class="calendar-nav">
                    <button class="btn btn-secondary btn-small" onclick="previousMonth()">‹</button>
                    <button class="btn btn-secondary btn-small" onclick="goToToday()" data-i18n="calendar_today">اليوم</button>
                    <button class="btn btn-secondary btn-small" onclick="nextMonth()">›</button>
                </div>
            </div>
            
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
        
        <div class="event-list">
            <h3 class="mb-2" data-i18n="calendar_events">الأحداث</h3>
            <div id="selectedDateEvents"></div>
        </div>
    </div>

    <script src="./translations.js"></script>
    <script src="./storage.js"></script>
    <script src="./script.js"></script>
    <script>
        let currentDate = new Date();
        let selectedDate = new Date();

        // رسم التقويم
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            // تحديث عنوان الشهر
            const monthNames = [
                t('month_jan'), t('month_feb'), t('month_mar'), t('month_apr'),
                t('month_may'), t('month_jun'), t('month_jul'), t('month_aug'),
                t('month_sep'), t('month_oct'), t('month_nov'), t('month_dec')
            ];
            document.getElementById('currentMonth').textContent = `${monthNames[month]} ${year}`;
            
            // الحصول على اليوم الأول من الشهر
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDay = firstDay.getDay();
            
            // أسماء الأيام
            const dayKeys = ['day_sun', 'day_mon', 'day_tue', 'day_wed', 'day_thu', 'day_fri', 'day_sat'];
            
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            // إضافة رؤوس الأيام
            dayKeys.forEach(key => {
                const header = document.createElement('div');
                header.className = 'calendar-day-header';
                header.innerHTML = `<span class="day-full">${t(key)}</span><span class="day-short">${t(key + '_short')}</span>`;
                grid.appendChild(header);
            });
            
            // إضافة أيام الشهر السابق
            const prevMonthLastDay = new Date(year, month, 0).getDate();
            for (let i = startDay - 1; i >= 0; i--) {
                const day = document.createElement('div');
                day.className = 'calendar-day other-month';
                day.textContent = prevMonthLastDay - i;
                grid.appendChild(day);
            }
            
            // إضافة أيام الشهر الحالي
            const today = new Date();
            const tasks = TaskStorage.getAllTasks();
            const reminders = ReminderStorage.getAllReminders();
            
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                dayElement.textContent = day;
                
                const currentDayDate = new Date(year, month, day);
                const dateString = toLocalDateString(currentDayDate);
                
                // تحديد اليوم الحالي
                if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    dayElement.classList.add('today');
                }
                
                // التحقق من وجود أحداث
                const hasTask = tasks.some(t => t.dueDate === dateString);
                const hasReminder = reminders.some(r => r.date === dateString);
                
                if (hasTask || hasReminder) {
                    dayElement.classList.add('has-events');
                }
                
                dayElement.onclick = () => selectDate(currentDayDate);
                grid.appendChild(dayElement);
            }
            
            // إضافة أيام الشهر التالي
            const remainingDays = 42 - grid.children.length + 7;
            for (let day = 1; day <= remainingDays; day++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day other-month';
                dayElement.textContent = day;
                grid.appendChild(dayElement);
            }
        }

        // اختيار تاريخ
        function selectDate(date) {
            selectedDate = date;
            displayEventsForDate(date);
        }

        // عرض أحداث التاريخ المحدد
        function displayEventsForDate(date) {
            const dateString = toLocalDateString(date);
            const tasks = TaskStorage.getAllTasks().filter(t => t.dueDate === dateString);
            const reminders = ReminderStorage.getAllReminders().filter(r => r.date === dateString);
            
            const container = document.getElementById('selectedDateEvents');
            
            if (tasks.length === 0 && reminders.length === 0) {
                container.innerHTML = `
                    <div class="card text-center">
                        <p style="color: var(--text-secondary);">${formatDate(dateString)}</p>
                        <p style="color: var(--text-secondary);" data-i18n="calendar_no_events">${t('calendar_no_events')}</p>
                    </div>
                `;
                return;
            }
            
            let html = `<h4 style="margin-bottom: 1rem;">${formatDate(dateString)}</h4>`;
            
            // عرض المهام
            tasks.forEach(task => {
                html += `
                    <div class="event-item task">
                        <div class="flex-between">
                            <div>
                                <strong>📋 ${escapeHtml(task.title)}</strong>
                                ${task.description ? `<p style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">${escapeHtml(task.description)}</p>` : ''}
                                <div style="margin-top: 0.5rem;">
                                    <span class="badge badge-${getCategoryColor(task.category)}">${t('tasks_filter_' + task.category)}</span>
                                    <span class="badge badge-${getPriorityColor(task.priority)}">${t('task_priority_' + task.priority)}</span>
                                </div>
                            </div>
                            ${task.completed ? '<span style="font-size: 1.5rem;">✓</span>' : ''}
                        </div>
                    </div>
                `;
            });
            
            // عرض التذكيرات
            reminders.forEach(reminder => {
                html += `
                    <div class="event-item reminder">
                        <strong>🔔 ${escapeHtml(reminder.title)}</strong>
                        ${reminder.description ? `<p style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">${escapeHtml(reminder.description)}</p>` : ''}
                        <p style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.5rem;">⏰ ${formatTime(reminder.time)}</p>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            updatePageTranslations();
        }

        // الشهر السابق
        function previousMonth() {
            currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
            renderCalendar();
        }

        // الشهر التالي
        function nextMonth() {
            currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
            renderCalendar();
        }

        // الذهاب إلى اليوم
        function goToToday() {
            currentDate = new Date();
            selectedDate = new Date();
            renderCalendar();
            displayEventsForDate(selectedDate);
        }

        // تهيئة الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            renderCalendar();
            displayEventsForDate(selectedDate);
        });

        document.addEventListener('app:languagechange', () => {
            renderCalendar();
            displayEventsForDate(selectedDate);
        });
    </script>
</body>

</html>
